server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /maps/route {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $routes_target https://routes.googleapis.com/directions/v2:computeRoutes;
    proxy_pass $routes_target;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host routes.googleapis.com;
    proxy_set_header X-Goog-Api-Key $http_x_goog_api_key;
    proxy_set_header X-Goog-FieldMask $http_x_goog_fieldmask;
    proxy_set_header Content-Type application/json;
    proxy_set_header Referer $http_referer;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
